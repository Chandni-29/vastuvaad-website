<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 430" width="654" height="430">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&amp;family=Outfit:wght@400;500;600&amp;display=swap');
      .vv-brand-title {
        font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', serif;
        font-weight: 800;
      }
      .vv-brand-sub {
        font-family: 'Outfit', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: 0.38em;
      }
    </style>
  </defs>
  
  <!-- House Gable Roof & Vertical Framing Walls -->
  <g fill="none" stroke="#0D233A" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Roof Slope & Wall terminating on top of V -->
    <path d="M 327 18 L 98 166 Q 88 172 88 186 L 88 308" stroke-width="3.8" />
    <!-- Right Roof Slope & Wall terminating on top of D -->
    <path d="M 327 18 L 556 166 Q 566 172 566 186 L 566 308" stroke-width="3.8" />
  </g>

  <!-- Concentric Celestial Rings -->
  <g fill="none" stroke="#0D233A">
    <!-- Outer Ring -->
    <circle cx="327" cy="166" r="94" stroke-width="3.2" />
    <!-- Inner Ring -->
    <circle cx="327" cy="166" r="74" stroke-width="2.2" />
    <!-- Central Hub Outer Ring -->
    <circle cx="327" cy="166" r="16" stroke-width="2.0" />
    <!-- Central Hub Inner Ring -->
    <circle cx="327" cy="166" r="7" stroke-width="1.4" />
  </g>

  <!-- Vastu Directional Compass Star -->
  <g stroke="#0D233A" stroke-linejoin="round">
    <!-- North Cardinal Point (towards roof apex) -->
    <polygon points="327,22 312,166 327,166" fill="none" stroke-width="2" />
    <polygon points="327,22 342,166 327,166" fill="#0D233A" fill-opacity="0.12" stroke-width="2" />
    <line x1="327" y1="22" x2="327" y2="166" stroke-width="2" />

    <!-- South Cardinal Point (towards VASTUVAAD) -->
    <polygon points="327,310 312,166 327,166" fill="#0D233A" fill-opacity="0.12" stroke-width="2" />
    <polygon points="327,310 342,166 327,166" fill="none" stroke-width="2" />
    <line x1="327" y1="166" x2="327" y2="310" stroke-width="2" />

    <!-- West Cardinal Point -->
    <polygon points="183,166 327,151 327,166" fill="#0D233A" fill-opacity="0.12" stroke-width="2" />
    <polygon points="183,166 327,181 327,166" fill="none" stroke-width="2" />
    <line x1="183" y1="166" x2="327" y2="166" stroke-width="2" />

    <!-- East Cardinal Point -->
    <polygon points="471,166 327,151 327,166" fill="none" stroke-width="2" />
    <polygon points="471,166 327,181 327,166" fill="#0D233A" fill-opacity="0.12" stroke-width="2" />
    <line x1="327" y1="166" x2="471" y2="166" stroke-width="2" />

    <!-- North-East Diagonal Point -->
    <polygon points="397,96 327,166 338,155" fill="none" stroke-width="1.8" />
    <polygon points="397,96 327,166 338,177" fill="#0D233A" fill-opacity="0.12" stroke-width="1.8" />
    <line x1="327" y1="166" x2="397" y2="96" stroke-width="1.8" />

    <!-- North-West Diagonal Point -->
    <polygon points="257,96 327,166 316,155" fill="#0D233A" fill-opacity="0.12" stroke-width="1.8" />
    <polygon points="257,96 327,166 316,177" fill="none" stroke-width="1.8" />
    <line x1="327" y1="166" x2="257" y2="96" stroke-width="1.8" />

    <!-- South-East Diagonal Point -->
    <polygon points="397,236 327,166 338,155" fill="#0D233A" fill-opacity="0.12" stroke-width="1.8" />
    <polygon points="397,236 327,166 338,177" fill="none" stroke-width="1.8" />
    <line x1="327" y1="166" x2="397" y2="236" stroke-width="1.8" />

    <!-- South-West Diagonal Point -->
    <polygon points="257,236 327,166 316,155" fill="none" stroke-width="1.8" />
    <polygon points="257,236 327,166 316,177" fill="#0D233A" fill-opacity="0.12" stroke-width="1.8" />
    <line x1="327" y1="166" x2="257" y2="236" stroke-width="1.8" />
  </g>

  <!-- Rosette Ocular Aperture in Central Hub -->
  <g fill="none" stroke="#0D233A" stroke-width="1.3">
    <path d="M 320 166 Q 327 160 334 166 Q 327 172 320 166 Z" />
    <path d="M 327 159 Q 333 166 327 173 Q 321 166 327 159 Z" />
  </g>

  <!-- Primary Wordmark: VASTUVAAD -->
  <!-- textLength of 480 aligns exactly from left wall x=88 to right wall x=568 -->
  <text
    x="327"
    y="384"
    text-anchor="middle"
    fill="#0D233A"
    class="vv-brand-title"
    font-size="84"
    textLength="482"
    lengthAdjust="spacing"
  >VASTUVAAD</text>

  <!-- Secondary Subtitle: INTERIORS -->
  <text
    x="327"
    y="422"
    text-anchor="middle"
    fill="#0D233A"
    class="vv-brand-sub"
    font-size="24"
  >INTERIORS</text>
</svg>